name: Tests

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Setup Node.js
      uses: actions/setup-node@v1
      with:
        node-version: 16.x
    - uses: c-hive/gha-yarn-cache@v1
    - name: Install dependencies
      run: yarn
    - name: Build main process
      run: yarn build:main
    - name: Build renderer process
      run: yarn build:renderer
    - name: Test
      run: yarn test

