name: Build

on:
  push:
    branches: [ stage ]
  pull_request:
    branches: [ stage ]

jobs:
  release-project:
    runs-on: ubuntu-latest
    needs: build-project
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v3
        with:
          name: sawib-win64
          path: ./
      - name: Generate Version & Tag Name
        id: bump_version
        uses: mathieudutour/github-tag-action@v6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.bump_version.outputs.new_tag }}
          release_name: ${{ steps.bump_version.outputs.new_tag }}
          body: ${{ steps.bump_version.outputs.changelog }}
          draft: false
          prerelease: false
      - name: Upload the Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: sawib-win64.zip
          asset_name: sawib-win64.zip
          asset_content_type: application/zip

  build-project:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'
      - name: Removing Proxy - 1
        run: npm config rm proxy
      - name: Removing Proxy - 2
        run: npm config rm https-proxy
      - name: Install dependencies
        run: yarn install --network-timeout 1000000
      - name: Build
        run: yarn make
      - name: Zip Project
        uses: vimtor/action-zip@v1
        with:
          files: release/build/win-unpacked
          dest: ./sawib-win64.zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: sawib-win64
          path: ./sawib-win64.zip
